<script>
'use strict';
// =================== YARDIMCILAR ===================
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const R=Math.random, ri=(a,b)=>a+Math.floor(R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];
const angDiff=(a,b)=>{let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;};
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y,z){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(z|0,1440662683);h=Math.imul(h^(h>>>13),1274126177);return(h^(h>>>16))>>>0;}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>clamp(Math.round(v+amt),0,255);return'rgb('+f(n>>16)+','+f(n>>8&255)+','+f(n&255)+')';}
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const fmtClock=t=>String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
const FN=['Ahmet','Mehmet','Mustafa','Ali','Hüseyin','Emre','Burak','Can','Murat','Kerem','Ayşe','Fatma','Zeynep','Elif','Merve','Selin','Deniz','Ece','Hakan','Serkan','Okan','Gökhan','Cem','Tolga','Yusuf','Kaan','Derya','Gizem'];
const LN=['Yılmaz','Kaya','Demir','Şahin','Çelik','Yıldız','Aydın','Öztürk','Arslan','Doğan','Kılıç','Aslan','Koç','Kurt','Polat','Erdem','Güneş','Tekin','Bulut','Korkmaz','Özdemir','Karaca'];
const rname=()=>pick(FN)+' '+pick(LN);
const COLORS=[['Beyaz','#e9ecef'],['Siyah','#22252a'],['Kırmızı','#c0392b'],['Mavi','#2e6fd8'],['Gri','#8a9099'],['Yeşil','#2f8f5b'],['Sarı','#e0b62d']];
const L=()=>String.fromCharCode(65+ri(0,25));
const plate=()=>'34 '+L()+L()+' '+ri(100,999);

// =================== SABİTLER ===================
const S=800,RW=140,HW=250,WB=6,LIM=WB*S,KMH=0.3,TS=0.5,SEED=1337;
const hh=k=>k===0?HW/2:RW/2;
const DV=[[1,0],[0,1],[-1,0],[0,-1]];
const DIST={
 merkez:{n:'Merkez',crime:1.0,col:'#5d6d86',g:'#3b4452',desc:'Dengeli suç, yoğun trafik'},
 konut:{n:'Yeşilvadi Konutları',crime:0.75,col:'#a3725c',g:'#3e5b3b',desc:'Ev hırsızlıkları'},
 sanayi:{n:'Sanayi Bölgesi',crime:1.25,col:'#716c5d',g:'#46453e',desc:'Depolar, kaçakçılık'},
 liman:{n:'Liman',crime:1.6,col:'#4f6973',g:'#38494f',desc:'Organize suç'},
 eski:{n:'Eski Şehir',crime:1.4,col:'#8c6b4b',g:'#4b4036',desc:'Gece kavgaları, gasp'}};
function districtAt(cx,cy){if(cx>=2)return cy<0?'liman':'sanayi';if(cx<=-3)return'eski';if(Math.abs(cy)>=2)return'konut';return'merkez';}
const distAtP=(x,y)=>districtAt(clamp(Math.floor(x/S),-WB,WB-1),clamp(Math.floor(y/S),-WB,WB-1));
const RANKS=[{n:'Polis Memuru Adayı',xp:0,sal:120},{n:'Polis Memuru',xp:350,sal:160},{n:'Kıdemli Polis Memuru',xp:1000,sal:210},{n:'Komiser Yardımcısı',xp:2200,sal:280},{n:'Komiser',xp:4000,sal:360},{n:'Başkomiser',xp:6800,sal:460},{n:'Emniyet Amiri',xp:10500,sal:600},{n:'Emniyet Müdürü',xp:16000,sal:800}];
const VEH={
 sedan:{n:'Devriye Sedanı',acc:270,max:560,turn:2.7,grip:6,len:42,wid:20,dur:1,col:'#f2f4f7',lb:1,rank:0},
 suv:{n:'Devriye SUV',acc:240,max:520,turn:2.35,grip:6.6,len:46,wid:23,dur:0.6,col:'#1d2a3c',lb:1,rank:1},
 moto:{n:'Polis Motosikleti',acc:350,max:620,turn:3.4,grip:7,len:26,wid:10,dur:1.8,col:'#f2f4f7',lb:1,rank:1,moto:1},
 traffic:{n:'Trafik Polisi Aracı',acc:285,max:600,turn:2.7,grip:6,len:43,wid:20,dur:1,col:'#ececec',stripe:'#e8c400',lb:1,rank:1,radar:1.8},
 civil:{n:'Sivil Polis Aracı',acc:275,max:580,turn:2.65,grip:6,len:42,wid:20,dur:1,col:'#3a3f47',lb:0,rank:2,civil:1},
 special:{n:'Özel Operasyon Aracı',acc:210,max:500,turn:2.1,grip:7,len:52,wid:26,dur:0.35,col:'#141a22',lb:1,rank:4},
 gt:{n:'Interceptor GT ★',acc:370,max:680,turn:2.9,grip:6.8,len:44,wid:20,dur:0.8,col:'#0a1a3a',lb:1,rank:0,premium:150}};
const CIVSPEC={len:40,wid:19};
const HOMES=[{n:'Lojman koğuşu',rent:0,price:0,com:38},{n:'Kiralık 1+1 (Eski Şehir)',rent:40,price:0,com:55},{n:'Kiralık 2+1 (Merkez)',rent:85,price:0,com:68},{n:'Satılık daire (Yeşilvadi)',rent:0,price:9000,com:80},{n:'Bahçeli villa',rent:0,price:40000,com:92}];
const FURN=[{id:'bed',n:'Ortopedik yatak',p:400,com:8},{id:'sofa',n:'Kanepe takımı',p:300,com:4},{id:'tv',n:'Akıllı TV',p:450,com:3},{id:'coffee',n:'Kahve makinesi',p:150,com:2},{id:'books',n:'Kitaplık',p:120,com:2},{id:'plants',n:'Bitki & dekor',p:80,com:2},{id:'lux',n:'Lüks dekor paketi ★',cr:60,com:8}];
const OUTFITS=[{id:'std',n:'Standart lacivert üniforma',p:0,col:'#1f3b73'},{id:'winter',n:'Kışlık mont',p:80,col:'#2b3a4a'},{id:'civil',n:'Sivil kıyafet (gizli görevlerde fark edilmeyi azaltır)',p:60,col:'#6b5b4b'},{id:'night',n:'Gece Operasyon üniforması ★',cr:30,col:'#111821'},{id:'parade',n:'Tören üniforması ★',cr:40,col:'#0d2a5c'}];
const LIVERIES=[{id:'std',n:'Standart',cr:0},{id:'retro',n:'Retro beyaz-mavi ★',cr:40},{id:'matte',n:'Mat siyah ★',cr:50}];
const PCARS=[{n:'İkinci el hatchback',p:2500},{n:'Aile sedanı',p:7000},{n:'Spor coupe',p:22000}];
const TRAITS=['Sürücü','Dedektif','Müzakereci','Taktik'];

// =================== DURUM ===================
const cv=$('c'),ctx=cv.getContext('2d');const lc=document.createElement('canvas'),lx=lc.getContext('2d');
const mini=$('mini'),mx=mini.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';lc.width=Math.ceil(W/2);lc.height=Math.ceil(H/2);if(window.__r3)resize3D();}
addEventListener('resize',resize);resize();
let G=null,SH=null,mode='title',modalOpen=false;
let player={x:0,y:0,a:0,mode:'car',walk:0};let pcar=null;
let cars=[],peds=[],props=[],skids=[];
let cam={x:0,y:0},zoom=0.7,shake=0;
let sirenOn=false,lightsOn=false,camOn=true,weather='clear',weatherT=0;
let mission=null,offer=null,offerT=0,nextOffer=8,stopTarget=null,stopTimer=0,backupCD=0,chatterT=12,trafT=0;
let INT=null,perfNow=0,uiT=0,interactNow=null,KARAKOL={x:0,y:0};
const rain=[];for(let i=0;i<140;i++)rain.push({x:R(),y:R(),s:0.6+R()*0.6});

// =================== DÜNYA / SEKTÖRLER ===================
const chunks=new Map();
function genChunk(cx,cy){
 const rnd=mulberry(hash2(cx,cy,SEED));const d=districtAt(cx,cy);
 const x0=cx*S+RW/2+22,x1=(cx+1)*S-RW/2-22,y0=cy*S+hh(cy)+22,y1=(cy+1)*S-hh(cy+1)-22;
 const b=[],pr=[],doors=[];const mxm=(x0+x1)/2,mym=(y0+y1)/2,al=14;
 const lots=[[x0,y0,mxm-al,mym-al],[mxm+al,y0,x1,mym-al],[x0,mym+al,mxm-al,y1],[mxm+al,mym+al,x1,y1]];
 const gasLot=(hash2(cx,cy,7)%5===0)?3:-1;
 lots.forEach((Lt,i)=>{
  const[lx0,ly0,lx1,ly1]=Lt;const r=rnd();
  if(cx===0&&cy===1&&i===0){const bb={x:lx0,y:ly0+30,w:lx1-lx0,h:ly1-ly0-30,col:'#244a82',kind:'karakol',hgt:1.6,det:[]};b.push(bb);doors.push({x:bb.x+bb.w/2,y:bb.y-8,kind:'karakol'});return;}
  if(cx===0&&cy===1&&i===1){pr.push({t:'lot',x:lx0,y:ly0,w:lx1-lx0,h:ly1-ly0});return;}
  if(i===gasLot){pr.push({t:'gas',x:lx0,y:ly0,w:lx1-lx0,h:ly1-ly0});return;}
  if(r<(d==='konut'?0.22:0.13)){pr.push({t:'park',x:lx0,y:ly0,w:lx1-lx0,h:ly1-ly0});for(let k=0;k<6;k++)pr.push({t:'tree',x:lerp(lx0+15,lx1-15,rnd()),y:lerp(ly0+15,ly1-15,rnd()),r:10+rnd()*10});return;}
  const ins=d==='konut'?14+rnd()*30:6+rnd()*18;
  const bb={x:lx0+ins,y:ly0+ins,w:lx1-lx0-ins*2,h:ly1-ly0-ins*2,col:shade(DIST[d].col,(rnd()-0.5)*44),kind:d==='sanayi'||d==='liman'?'depo':'bld',hgt:d==='merkez'?1.2+rnd()*2.2:0.6+rnd()*0.9,det:[]};
  const nd=1+Math.floor(rnd()*3);for(let k=0;k<nd;k++)bb.det.push({x:bb.x+8+rnd()*(bb.w-36),y:bb.y+8+rnd()*(bb.h-30),w:12+rnd()*16,h:10+rnd()*12});
  b.push(bb);
  if(rnd()<0.42){doors.push({x:bb.x+bb.w/2,y:i<2?bb.y-7:bb.y+bb.h+7,kind:d==='konut'?'house':(rnd()<0.5?'shop':'house')});}
  if(d==='konut'&&rnd()<0.5)pr.push({t:'tree',x:lx0+6,y:ly0+6,r:9});

function updCar(c,dt){

function updPlayerCar(dt){
 const c=pcar,sp=VEH[c.type];let thr=0,steer=0,brk=keys.brake?1:0;const hand=keys.hand;
 if(kb.up||kb.down||kb.left||kb.right){thr=kb.up?1:0;if(kb.down){if(c.v>15)brk=1;else thr=-1;}steer=kb.right-kb.left;}
 else if(joy.mag>0.12){const jx=Math.cos(joy.ang)*joy.mag,jy=-Math.sin(joy.ang)*joy.mag;steer=Math.abs(jx)>0.12?clamp(jx*1.25,-1,1):0;if(jy>0.15)thr=Math.min(1,jy*1.2);else if(jy<-0.25){if(c.v>15)brk=Math.min(1,-jy*1.3);else thr=-Math.min(1,-jy);}}
 const fat=G.fatigue;const resp=1-Math.max(0,fat-50)/110;if(fat>72)steer+=Math.sin(perfNow/650)*0.15*(fat-72)/28;
 if(c.fuel<=0&&thr>0){thr=0;}
 if(thr>0)c.v+=sp.acc*thr*dt*(c.v<0?2.5:1);else if(thr<0){if(c.v>10)c.v-=520*dt;else c.v+=sp.acc*0.6*thr*dt;}
 if(brk)c.v-=Math.sign(c.v)*Math.min(Math.abs(c.v),740*dt);
 if(hand)c.v-=Math.sign(c.v)*Math.min(Math.abs(c.v),240*dt);
 if(!thr&&!brk)c.v-=Math.sign(c.v)*Math.min(Math.abs(c.v),70*dt);
 c.v-=c.v*0.16*dt;
 const vmax=sp.max*(1-c.dmg/230)*(c.tire<20?0.8:1);c.v=clamp(c.v,-170,vmax);
 const vf=clamp(c.v/140,-1,1)*(1-clamp((Math.abs(c.v)-260)/900,0,0.45));
 c.a+=steer*sp.turn*vf*dt*resp*(hand?1.4:1);
 const grip=sp.grip*(0.45+0.55*c.tire/100)*(weather==='rain'?0.62:1)*(hand?0.2:1);
 const tvx=Math.cos(c.a)*c.v,tvy=Math.sin(c.a)*c.v,k=1-Math.exp(-grip*dt);const slip=Math.hypot(tvx-c.vx,tvy-c.vy);
 c.vx=lerp(c.vx,tvx,k);c.vy=lerp(c.vy,tvy,k);c.x+=c.vx*dt;c.y+=c.vy*dt;
 c.tire=Math.max(0,c.tire-slip*dt*0.0032);c.fuel=Math.max(0,c.fuel-(Math.abs(thr)*0.11+0.008)*dt*(sp.moto?0.6:1));
 if(slip>130&&Math.abs(c.v)>110&&R()<0.6){skids.push({x:c.x,y:c.y,a:c.a,t:20});if(skids.length>260)skids.shift();}
 const r=sp.wid*0.62;
 for(const s of[-1,1]){const o={x:c.x+Math.cos(c.a)*sp.len*0.28*s,y:c.y+Math.sin(c.a)*sp.len*0.28*s};const ox=o.x,oy=o.y;const h=collideCircle(o,r);
  if(h){c.x+=o.x-ox;c.y+=o.y-oy;const imp=-(c.vx*h.ux+c.vy*h.uy);if(imp>0){c.vx+=h.ux*imp*1.25;c.vy+=h.uy*imp*1.25;if(imp>90){c.dmg=Math.min(100,c.dmg+imp*0.022*sp.dur);shake=Math.min(12,imp/40);beep(90,0.15,0.06);if(imp>320)G.hp=Math.max(5,G.hp-imp*0.012);}}c.v=c.vx*Math.cos(c.a)+c.vy*Math.sin(c.a);}}
 player.x=c.x;player.y=c.y;player.a=c.a;
}
function updFoot(dt){
 let fw=0,rt=0;if(kb.up||kb.down||kb.left||kb.right){fw=kb.up-kb.down;rt=kb.right-kb.left;}else if(joy.mag>0.15){fw=-Math.sin(joy.ang)*joy.mag;rt=Math.cos(joy.ang)*joy.mag;}
 player._fwd=fw>0.5&&Math.abs(rt)<0.5;const cfx=Math.cos(camYaw),cfy=Math.sin(camYaw);let mvx=cfx*fw-cfy*rt,mvy=cfy*fw+cfx*rt;
 const m=Math.hypot(mvx,mvy);if(m>1){mvx/=m;mvy/=m;}
 const spd=168*(1-Math.max(0,G.fatigue-40)/140)*(G.hp<40?0.8:1)*(G.hunger>85?0.9:1);
 player.x+=mvx*spd*dt;player.y+=mvy*spd*dt;if(m>0.1){player.a=Math.atan2(mvy,mvx);player.walk+=dt*12*Math.min(1,m);}
 collideCircle(player,9);
}
function carCollisions(){
 if(!pcar)return;const sp=VEH[pcar.type];
 for(const c of cars){
  const d=dist(pcar.x,pcar.y,c.x,c.y);const rr=sp.wid*0.55+sp.len*0.2+16;if(d>=rr||d<0.01)continue;
  const nx=(pcar.x-c.x)/d,ny=(pcar.y-c.y)/d;const pen=rr-d;
  pcar.x+=nx*pen*(c.kind==='wreck'?1:0.6);pcar.y+=ny*pen*(c.kind==='wreck'?1:0.6);if(c.kind!=='wreck'){c.x-=nx*pen*0.4;c.y-=ny*pen*0.4;}
  const cvx=c.kind==='wreck'?0:DV[c.dir][0]*c.v,cvy=c.kind==='wreck'?0:DV[c.dir][1]*c.v;const rel=-((pcar.vx-cvx)*nx+(pcar.vy-cvy)*ny);
  if(rel>0){pcar.vx+=nx*rel*0.9;pcar.vy+=ny*rel*0.9;pcar.v=pcar.vx*Math.cos(pcar.a)+pcar.vy*Math.sin(pcar.a);
   if(rel>60){pcar.dmg=Math.min(100,pcar.dmg+rel*0.018*sp.dur);shake=Math.min(10,rel/40);beep(110,0.1,0.05);
    if(c.flee&&c.hp!==undefined){c.hp-=rel*0.13;if(!c._rammed){c._rammed=1;bc('Kaçan araca müdahale (çarpma)');}}
    else if(c.kind==='civ'&&!c.flee){c.angry=3;if(rel>140&&!(c.mission&&c.mission.stage==='chase'))flag('Sivil araca çarpma (kaza)',1,0.35);}
    else if(c.kind==='cop'&&rel>140){flag('Ekip aracına çarpma',1,0.2);}
   }}
 }
}

 }

 if(player.mode==='foot'&&pcar)cand(dist(player.x,player.y,pcar.x,pcar.y)+20,'Araca bin',toggleEnter,60);
 for(const c of chunks.values()){

 }
 return best;

function makeMission(type,o={}){
 const T=MT[type];const m={id:ri(1000,9999),type,n:T.n,pri:T.pri,ev:[],st:[],log:[],stage:'go',limit:0,spawned:false};Object.assign(m,o);
 T.setup(m);m.dist=distAtP(m.x,m.y);const crime=DIST[m.dist].crime;
 const rb=[{m:260,xp:150},{m:150,xp:85},{m:75,xp:40}][m.pri];const rm=1+G.rank*0.12;
 m.rew={m:Math.round(rb.m*rm*(0.8+crime*0.25)*(m.story?1.6:1)),xp:Math.round(rb.xp*(0.8+crime*0.2)*(m.story?1.8:1))};
 m.pen={m:[120,70,30][m.pri],xp:[60,35,15][m.pri],d:[2,1,1][m.pri]};
 if(!m.limit)m.limit=Math.round(dist(player.x,player.y,m.x,m.y)/200+[40,60,85][m.pri]);
 m.t=m.limit;if(!m.sdesc)m.sdesc=genDesc();return m;

 add('speed',G.region==='merkez'?5:3);add('patrol',2);add('accident',3+(trafficMul()>1.4?3:0));add('burglary',3+(G.region==='konut'?3:0));add('fight',2+Math.round(n*4)+(G.region==='eski'?2:0));add('flee',3);add('robbery',1+Math.round(n*2));add('undercover',2+(G.region==='liman'||G.region==='sanayi'?2:0));add('hostage',1);

function startChase(m,c){c.flee=true;c.stopping=false;c.stopped=false;c.hp=100;c.keep=true;c.mission=m;updBase(c);m.stage='chase';m.lost=0;radio('Şüpheli araç kaçıyor! Takibe başla. (TAKVİYE isteyebilirsin)','bad');bc('Araç takibi başladı: '+c.plate);}
function chaseUpdate(m,dt){

 if(d>1650){m.lost+=dt;if(m.lost>12)return fail(m,'Şüpheli araç gözden kayboldu');}else m.lost=Math.max(0,m.lost-dt);
 if(d<85&&c.v<100)m.box=(m.box||0)+dt;else m.box=Math.max(0,(m.box||0)-dt*0.5);
 if(c.hp<=0||m.box>2.2){
  c.flee=false;c.kind='wreck';c.v=Math.min(c.v,120);c.a=c.dir*Math.PI/2;c.smoke=true;radio('Şüpheli araç durdu! Şüpheli araçtan iniyor!','warn');bc('Kaçan araç durduruldu');
  m.ev.push({n:'Kaçış aracı ('+c.plate+')'});const s=makePed('suspect',c.x+18,c.y+22);s.keep=true;s.mission=m;s.armed=!!m.armed;s.col=m.armed?'#111':'#7a5230';s.ai=R()<(m.armed?0.5:0.55)?'flee':'idle';m.sus=s;peds.push(s);m.stage='foot';if(s.ai==='flee')bc('Şüpheli yaya olarak kaçıyor');
 }
}
function footStage(m,dt){

function genDriver(c,o={}){const d={name:rname(),plate:c.plate,lic:R()<0.82?'Geçerli':R()<0.5?'Süresi dolmuş':'Yok',drunk:R()<(nightF()>0.5?0.24:0.07),stolen:R()<0.06,contraband:R()<0.1,speed:o.speed||(c.speeder?Math.round(c.base*KMH):0),limit:o.limit||(Math.abs(c.y)<HW/2+5?120:50)};d.smell=d.drunk&&R()<0.7;d.bribe=R()<0.45?ri(3,12)*25:0;return d;}
const hasCause=d=>d.smell||(d.drunk&&d.alcChecked)||(d.stolen&&d.docChecked);
function trafficStop(c,m){
 const d=c.drv||(c.drv=genDriver(c));if(!d.started){d.started=1;bc('Trafik kontrolü: '+d.plate+' — '+d.name);}
 const show=()=>{
  let info=`<div class="kv"><b>Sürücü:</b> ${d.name}<br><b>Plaka:</b> ${d.plate}<br>`+(d.speed?`<b>Radar:</b> <span class=${d.speed>d.limit?'bad':''}>${d.speed} km/h</span> (limit ${d.limit})<br>`:'<b>Radar:</b> ölçüm yok<br>')+
   (d.docChecked?`<b>Ehliyet:</b> <span class=${d.lic==='Geçerli'?'good':'bad'}>${d.lic}</span><br><b>Ruhsat/kayıt:</b> ${d.stolen?'<span class=bad>ÇALINTI ARAÇ KAYDI!</span>':'Temiz'}<br>`:'')+
   (d.alcChecked?`<b>Alkolmetre:</b> ${d.drunk?'<span class=bad>1.24 promil</span>':'0.00 promil'}<br>`:'')+
   (d.searched?`<b>Arama:</b> ${d.contraband?'<span class=bad>Bagajda kaçak sigara ve ruhsatsız bıçak</span>':'Bir şey bulunamadı'}<br>`:'')+(d.smell?'<i>Araçtan yoğun alkol kokusu geliyor.</i>':'')+'</div>';
  if(d.bribeShown&&!d.bribeRefused)info+=`<div class="warn">Sürücü alçak sesle: "Memur bey, şu ${d.bribe}$ sizde kalsın, kimse görmedi..."</div>`;
  const B=[];
  if(!d.docChecked)B.push({t:'🪪 Ehliyet & ruhsat iste',f:()=>{d.docChecked=1;bc('Belge kontrolü yapıldı'+(d.stolen?' — çalıntı kaydı':''));chkBribe();show();}});
  if(!d.alcChecked)B.push({t:'🍺 Alkol testi',f:()=>{d.alcChecked=1;bc('Alkol testi'+(d.drunk?' — POZİTİF':' — negatif'));chkBribe();show();}});
  if(!d.searched)B.push({t:'🔍 Aracı ara'+(hasCause(d)?'':' <small class=bad>(gerekçe yok)</small>'),f:()=>{d.searched=1;if(!hasCause(d))flag('Gerekçesiz araç araması',2,0.5);else bc('Araç araması (gerekçeli)');if(d.contraband)m?m.ev.push({n:'Araçta ele geçirilen kaçak malzeme'}):0;show();}});
  B.push({t:'🧾 Ceza yaz',f:()=>end('fine')},{t:'🗣 Sözlü uyarı',f:()=>end('warn')},{t:'🚛 Araca el koy (çekici)',f:()=>end('impound')},{t:'🔗 Gözaltına al',f:()=>end('arrest')});
  if(d.bribeShown&&!d.bribeRefused){const rk=riskCalc();B.push({t:`💵 Rüşveti al ve bırak (+$${d.bribe}) <small class=bad>risk %${Math.round(rk*100)}</small>`,c:'dark',f:()=>{corruptAct('Rüşvet alıp serbest bırakma ('+d.plate+')',d.bribe,rk,2);end('bribe');}});B.push({t:'✋ Rüşveti reddet, tutanağa geçir',c:'good',f:()=>{d.bribeRefused=1;honest('Rüşvet teklifini reddetti',4);show();}});}
  B.push({t:'Serbest bırak',f:()=>end('release')});
  modal('🚓 Trafik Kontrolü',info,B);
 };
 const chkBribe=()=>{if(!d.bribeShown&&d.bribe&&((d.drunk&&d.alcChecked)||(d.stolen&&d.docChecked)||(d.lic!=='Geçerli'&&d.docChecked)||d.speed>d.limit))d.bribeShown=1;};
 chkBribe();
 const end=kind=>{
  const kn={speed:d.speed>d.limit,lic:d.docChecked&&d.lic!=='Geçerli',drunk:d.alcChecked&&d.drunk,stolen:d.docChecked&&d.stolen,contra:d.searched&&d.contraband};
  const any=Object.values(kn).some(Boolean),serious=kn.drunk||kn.stolen||kn.contra;let score=0,txt='';
  if(kind==='fine'){if(any){score=1;txt='Ceza tutanağı düzenlendi.';bc('Trafik cezası yazıldı');}else{flag('Gerekçesiz ceza',1,0.4);txt='İhlal tespit edilmeden ceza yazdın!';}if(serious){score=0.5;txt+=' Ancak ciddi suç için sadece ceza yetersiz.';}}
  else if(kind==='warn'){score=serious?0:any?0.6:0.8;txt=serious?'Ciddi suçu uyarıyla geçiştirdin.':'Sürücü uyarıldı.';bc('Sözlü uyarı');if(serious)SH.disc+=1;}
  else if(kind==='impound'){if(kn.lic&&d.lic==='Yok'||kn.drunk||kn.stolen){score=1.2;txt='Araç yasal prosedürle otoparka çekildi.';bc('Araca el konuldu (yasal)');}else{flag('Hukuka aykırı el koyma',3,0.75);txt='Yasal dayanak olmadan araca el koydun!';}}
  else if(kind==='arrest'){if(serious){score=1.4;txt='Şüpheli gözaltına alındı.';bc('Sürücü gözaltına alındı');G.stats.arrests++;}else{flag('Haksız gözaltı',3,0.8);txt='Gözaltı için yeterli sebep yoktu!';}}
  else if(kind==='release'){score=serious?0:any?0.3:0.6;txt=serious?'Ciddi suç işleyen sürücüyü bilerek serbest bıraktın.':'Sürücü serbest bırakıldı.';if(serious){G.suspicion=clamp(G.suspicion+5,0,100);bc('⚠ Şüpheliyi bilerek serbest bırakma',true);SH.disc+=1;}}
  else if(kind==='bribe'){score=0;txt='Para cebinde. Sürücü gülümseyerek uzaklaştı.';}
  if(kind==='impound'||kind==='arrest'){const i=cars.indexOf(c);if(i>=0)cars.splice(i,1);}else{c.stopped=false;c.stopping=false;c.keep=false;c.mission=null;}
  if(stopTarget===c)stopTarget=null;
  if(m){if(score>=0.8)success(m,Math.min(1.3,score),txt);else if(score>0)success(m,score,txt);else fail(m,txt||'Uygunsuz işlem');}
  else{SH.stops++;G.stats.stops++;const mm=Math.round(25*score*(1+G.rank*0.1)),xp=Math.round(20*score);SH.earn+=mm;SH.xp+=xp;G.xp+=xp;radio(`Proaktif kontrol: ${txt} ${score>0?`(+$${mm}, +${xp} XP)`:''}`,score>0?'good':'warn');}
 };
 show();
}

function comfort(){let c=HOMES[G.home].com;for(const f of G.furn){const it=FURN.find(x=>x.id===f);if(it)c+=it.com;}return Math.min(100,c);}

 const tabs=[['durum','Durum'],['ev','Ev'],['market','Market'],['sosyal','Sosyal'],['garaj','Garaj'],['kiyafet','Kıyafet'],['ekip','Ekip'],['premium','★ Mağaza'],['kayit','Kayıtlar']];
 const T=tabs.map(([k,n])=>`<button class="tab ${k===hubTab?'on':''}" data-tab="${k}">${n}</button>`).join('');

   G.team.forEach((t,i)=>{rows.push({h:`<div class=kv><b>${t.name}</b> — ${t.trait} • Yetenek ${t.skill} • Moral ${t.morale} • Çözülen ${t.cases}<br>Atama: <select data-asg="${i}">${['takviye',...Object.keys(DIST)].map(a=>`<option value="${a}" ${a===t.assign?'selected':''}>${a==='takviye'?'Takviye ekibi':DIST[a].n+' devriyesi'}</option>`).join('')}</select><button class=mbtn data-tp="${i}" data-a="praise">Övgü</button> <button class=mbtn data-tp="${i}" data-a="train">Eğitim ($150)</button> <button class=mbtn data-tp="${i}" data-a="warn">Uyarı</button> <button class=mbtn data-tp="${i}" data-a="fire">Görevden al</button></div>`});});
   rows.push({h:'<h4>Başvurular</h4>'});
   if(!G.recruits.length||G.recruitDay!==G.day){G.recruitDay=G.day;G.recruits=[0,1,2].map(()=>({name:rname(),trait:pick(TRAITS),skill:ri(35,85),morale:ri(55,85),integ:ri(30,95),cases:0,assign:'takviye'}));}
   G.recruits.forEach((r,i)=>row(`${r.name} — ${r.trait}, yetenek ${r.skill}, sicil: ${r.integ>70?'temiz':r.integ>45?'orta':'şüpheli'}`,'İşe al',()=>{G.team.push(r);G.recruits.splice(i,1);openHub();},G.team.length>=slots));
  }
 }else if(hubTab==='premium'){
  body=`<div class=kv>★ Premium kredi: <b>${G.credits}</b><br><small>Kredi; A/B performans notu ve başarımlarla kazanılır. Gerçek parayla satın alma Android sürümünde Google Play Faturalandırma ile bağlanacak; bu tarayıcı sürümünde ödeme alınmaz.</small></div>`;
  rows.push({h:'<h4>Araç görünümleri</h4>'});LIVERIES.forEach(l=>{const has=G.liveries.includes(l.id);row(l.n,G.livery===l.id?'Aktif':has?'Kullan':l.cr+' kredi',()=>{if(!has){if(G.credits<l.cr)return radio('Kredi yetersiz.');G.credits-=l.cr;G.liveries.push(l.id);}G.livery=l.id;openHub();},G.livery===l.id);});
  rows.push({h:'<h4>Özel araçlar</h4>'});row('Interceptor GT ★ (en hızlı devriye aracı)',G.premium.gt?'Sahipsin':'150 kredi',()=>{if(G.credits<150)return radio('Kredi yetersiz.');G.credits-=150;G.premium.gt=1;openHub();},!!G.premium.gt);
  rows.push({h:'<h4>Üniforma & dekor</h4><small>Kıyafet ve Ev sekmelerindeki ★ öğeler.</small><h4>Hikâye genişletmeleri</h4>'});row('"Liman Dosyası" — yeni bölüm','Yakında',()=>{},true);
  row('TEST: +100 kredi (geliştirici modu)','Ekle',()=>{G.credits+=100;openHub();});
 }else if(hubTab==='kayit'){
  body=`<div class=kv>Toplam görev: ${G.stats.done} başarılı / ${G.stats.fail} başarısız • Gözaltı: ${G.stats.arrests} • Trafik kontrolü: ${G.stats.stops}<br>Hikâye aşaması: ${G.story.stage}/4 ${G.story.ending?'• Son: '+ENDINGS[G.story.ending][0]:''}</div>`;
  row('Vücut kamerası kayıtları','Aç',()=>showBodycam(()=>openHub()));
  row('Oyunu kaydet','Kaydet',()=>{save();radio('Kaydedildi.');openHub();});
  row('Ana menü','Çık',()=>{save();titleScreen();});
 }
 let rh='';rows.forEach((r,i)=>{rh+=r.h?r.h:`<div class=row><span>${r.l}</span><button data-r="${i}" ${r.dis?'disabled':''}>${r.bt}</button></div>`;});
 modal('🏠 Kişisel Yaşam',`<div class=tabs>${T}</div>${body}${rh}`,[{t:`😴 Uyu (8 saat)`,f:sleep},{t:'🚓 Vardiyaya git',c:'pri',f:briefing}]);
 document.querySelectorAll('#mbox [data-tab]').forEach(b=>b.onclick=()=>openHub(b.dataset.tab));
 document.querySelectorAll('#mbox [data-r]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.r];r.fn();});
 document.querySelectorAll('#mbox [data-asg]').forEach(s=>s.onchange=()=>{G.team[+s.dataset.asg].assign=s.value;});
 document.querySelectorAll('#mbox [data-tp]').forEach(b=>b.onclick=()=>{const t=G.team[+b.dataset.tp];const a=b.dataset.a;if(a==='praise')t.morale=Math.min(100,t.morale+8);if(a==='train'){if(G.money<150)return radio('Yetersiz bakiye.');G.money-=150;t.skill=Math.min(99,t.skill+6);}if(a==='warn'){t.morale-=8;t.integ=Math.min(100,t.integ+12);}if(a==='fire')G.team.splice(+b.dataset.tp,1);openHub();});
}
function sleep(){
 const c=comfort();G.fatigue=Math.max(0,G.fatigue-c);G.hunger=Math.min(100,G.hunger+18);G.stress=Math.max(0,G.stress-(G.engaged?15:8));G.hp=Math.min(100,G.hp+20);
 const rent=HOMES[G.home].rent;let msg=`Konfor ${c}: yorgunluk -${c}.`;
 if(rent){if(G.money>=rent){G.money-=rent;msg+=` Kira -$${rent}.`;}else{G.home=0;msg+=' Kirayı ödeyemedin, lojmana taşındın!';}}
 G.day++;G.time=7*60;G.coffeeDay=-1;if(G.hunger>80){G.hp=Math.max(30,G.hp-10);msg+=' Aç yattın, sağlığın düştü.';}
 save();modal('😴 Uyudun',msg,[{t:'Devam',f:()=>openHub()}]);
}

function newGame(name){G={name:name||'Memur',day:1,time:7*60,money:300,credits:20,xp:0,rank:0,disc:0,integrity:50,suspicion:0,corrupt:0,investigation:false,suspended:false,fatigue:10,hunger:20,stress:10,hp:100,home:0,ownHomes:[0],furn:[],meals:2,outfit:'std',outfits:['std'],livery:'std',liveries:['std'],premium:{},pcar:null,team:[],recruits:[],recruitDay:0,story:{stage:0,path:null,info:0,ending:null,planned:0},stats:{done:0,fail:0,arrests:0,stops:0},bodycam:[],complaints:[],rel:30,shiftType:'day',region:'merkez',veh:'sedan',medal:0};}

// =================== GÜNCELLEME ===================
function update(dt){
 if(mode==='title'){cam.x+=dt*40;cam.y=S*0.5+Math.sin(perfNow/9000)*300;player.x=cam.x;player.y=cam.y;manageChunks();return;}
 if(modalOpen||mode==='hub'||!SH)return;
 G.time+=dt*TS;if(G.time>=1440){G.time-=1440;G.day++;}
 const hr=dt*TS/60;G.fatigue=clamp(G.fatigue+hr*9*(G.hunger>80?1.4:1)*(G.stress>70?1.2:1),0,100);G.hunger=clamp(G.hunger+hr*6,0,100);
 if(!camOn)SH.camOff+=dt;backupCD-=dt;
 weatherT-=dt;if(weatherT<=0){weatherT=100+R()*120;const o=weather;setWeather();if(o!==weather)radio('Hava durumu: '+WNAME[weather]);}
 if(mode==='interior'){updInterior(dt);updMission(dt);interactNow=findInteract();return;}
 if(player.mode==='car')updPlayerCar(dt);else updFoot(dt);
 if(player.mode==='foot'&&pcar){pcar.v=0;}
 manageChunks();manageTraffic(dt);
 for(const c of cars)updCar(c,dt);for(const p of peds)updPed(p,dt);
 peds=peds.filter(p=>!(p.down&&p.downT<=0&&!p.keep));
 carCollisions();
 // proaktif durdurma
 if(player.mode==='car'&&sirenOn&&!stopTarget&&!(mission&&mission.car)){
  let tgt=null;for(const c of cars){if(c.kind!=='civ'||c.keep||c.flee)continue;const d=dist(c.x,c.y,player.x,player.y);if(d<150){const fx=Math.cos(pcar.a),fy=Math.sin(pcar.a);if((c.x-pcar.x)*fx+(c.y-pcar.y)*fy>0){tgt=c;break;}}}
  if(tgt){stopTimer+=dt;if(stopTimer>1.6){stopTarget=tgt;tgt.stopping=true;tgt.keep=true;tgt.drv=genDriver(tgt);radio('Araç sağa çekiyor (trafik kontrolü). Araçtan inip konuş.');bc('Araç durduruldu: '+tgt.plate);stopTimer=0;}}else stopTimer=Math.max(0,stopTimer-dt);
 }
 if(stopTarget&&!stopTarget.mission&&dist(stopTarget.x,stopTarget.y,player.x,player.y)>900){stopTarget.stopped=false;stopTarget.stopping=false;stopTarget.keep=false;stopTarget=null;radio('Durdurulan araç bırakıldı.');}
 // radar
 if(player.mode==='car'&&pcar){const rr=220*(VEH[pcar.type].radar||1);for(const c of cars){if(c.speeder&&!c.radared&&dist(c.x,c.y,player.x,player.y)<rr){c.radared=1;radio(`📡 Radar: ${c.plate} — ${Math.round(c.base*KMH)} km/h (limit 120). SİREN aç ve takip et.`,'warn');}}}
 // devriye puanı
 if(distAtP(player.x,player.y)===G.region&&(player.mode==='foot'||Math.abs(pcar.v)>30))SH.patrol+=dt*TS;
 updMission(dt);updOffers(dt);
 chatterT-=dt;if(chatterT<=0){chatterT=20+R()*25;radio(pick([`Ekip ${ri(2,40)}: ${pick(Object.values(DIST)).n} bölgesinde şüpheli araç kontrolü.`,`Merkez: ${pick(Object.values(DIST)).n} bölgesinde kaza ihbarı, ekip yönlendirildi.`,`Ekip ${ri(2,40)}: Olay yerindeyiz, durum kontrol altında.`,`Merkez: Tüm ekiplere, ${pick(COLORS)[0].toLowerCase()} bir araç aranıyor.`,`Ekip ${ri(2,40)}: Mola veriyoruz, 10 dakika.`]));}
 if(nowAbs()>=SH.endAbs&&!mission&&!SH.endWarned){SH.endWarned=1;modal('🕓 Vardiya bitti','Mesai sona erdi. Karakola dönebilir veya şimdi bitirebilirsin.',[{t:'Vardiyayı bitir',c:'pri',f:()=>endShift(false)},{t:'Karakola dönerim'}]);}
 if(G.hp<=5){radio('Ağır yaralandın! Hastaneye kaldırılıyorsun.','bad');G.hp=50;if(mission)fail(mission,'Memur yaralandı');endShift(true);}
 interactNow=findInteract();
}
function manageTraffic(dt){
 trafT-=dt;if(trafT>0)return;trafT=0.4;
 for(let i=cars.length-1;i>=0;i--){const c=cars[i];if(!c.keep&&dist(c.x,c.y,player.x,player.y)>1750)cars.splice(i,1);}
 for(let i=peds.length-1;i>=0;i--){const p=peds[i];if(!p.keep&&dist(p.x,p.y,player.x,player.y)>1400)peds.splice(i,1);}
 const civ=cars.filter(c=>c.kind==='civ'&&!c.keep).length,cops=cars.filter(c=>c.kind==='cop'&&!c.backup).length,np=peds.filter(p=>p.kind==='civ'&&!p.keep).length;
 if(civ<Math.round(18*trafficMul()))spawnCar('civ');if(cops<2)spawnCar('cop',800,1400);
 if(np<Math.round(24*pedMul()*(distAtP(player.x,player.y)==='merkez'?1.3:1)))spawnPed();
 if(Math.abs(player.y)<900&&R()<0.05&&cars.filter(c=>c.speeder).length<2){const p={x:player.x+(R()<.5?-1:1)*ri(800,1200),y:0};const dir=R()<.5?0:2;const c=makeCar('civ',{x:p.x,y:dir===0?85:-85,dir});c.speeder=true;c.sbase=ri(140,175)/KMH;updBase(c);c.v=c.base;cars.push(c);}
 if(!mission&&!offer&&R()<0.008){const cs=cars.filter(c=>c.kind==='civ'&&!c.keep&&dist(c.x,c.y,player.x,player.y)>450&&dist(c.x,c.y,player.x,player.y)<1100);if(cs.length){const c=cs[0];cars.splice(cars.indexOf(c),1);const m=makeMission('accident',{x:c.x,y:c.y,dir:c.dir});m.limit=m.t=70;radio('Yakınında bir trafik kazası oldu!','warn');showOffer(m);}}
}

 const mc=$('mcard');if(mission){mc.classList.remove('hidden');mc.innerHTML=`<div class="t">#${mission.id} ${mission.n}</div>${MT[mission.type].obj(mission)}<br>${mission.noTimer?'':`<span class="tm">⏱ ${fmtT(mission.t)}</span> • `}${(dist(player.x,player.y,mission.x,mission.y)/1000).toFixed(1)} km`;}
 else if(stopTarget){mc.classList.remove('hidden');mc.innerHTML='<div class="t">Trafik kontrolü</div>Araçtan in ve sürücüyle konuş';}
 else if(SH&&nowAbs()>=SH.endAbs){mc.classList.remove('hidden');mc.innerHTML='<div class="t">Vardiya bitti</div>Karakola dön (mavi nokta)';}
 else mc.classList.add('hidden');
}
function loop(t){
 const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;perfNow=t;
 try{update(dt);shake=Math.max(0,shake-dt*25);
  if(mode==='interior'&&INT)renderInterior3D(dt);else render3D(dt);
  overlay();
  if(mode==='play'||mode==='interior'){uiT-=dt;if(uiT<=0){uiT=0.1;hud();drawMini();}}
 }catch(e){console.error(e);}
 requestAnimationFrame(loop);
}
// =================== BAŞLANGIÇ ===================
function titleScreen(){
 mode='title';G=null;SH=null;$('hud').classList.add('hidden');$('ctrl').classList.add('hidden');cam.x=0;cam.y=S*0.5;
 const sv=load();
 modal('',`<div class="title">🚓 DEVRİYE</div><div class="sub">Şehrin Nabzı — Polis Simülasyonu</div>
 <p style="font-size:13px">En alt rütbeden başla. Anonslara yetiş, delil topla, şüphelileri yakala. Her kararın vücut kamerasına kaydediliyor. Dürüst mü kalacaksın, yoksa Kuzgun'un teklifini mi alacaksın?</p>
 <label>Memur adı</label><input type="text" id="pname" value="${sv?sv.name:'Kerem Aydın'}" maxlength="24">
 <small>En iyi deneyim için telefonu <b>yatay</b> tut. Sol: sürüş joystick'i, sağ: butonlar.</small>`,[
  sv?{t:`▶ Devam et (Gün ${sv.day}, ${RANKS[sv.rank].n})`,c:'pri full',f:()=>{G=sv;['outfits','liveries','ownHomes','furn','team','recruits','bodycam','complaints'].forEach(k=>{if(!G[k])G[k]=[];});openHub('durum');}}:null,
  {t:'Yeni kariyer',c:sv?'':'pri',keep:true,f:()=>{const n=($('pname').value||'Memur').trim();closeModal();newGame(n);howTo(()=>openHub('durum'));}},
  {t:'Nasıl oynanır?',keep:true,f:()=>{closeModal();howTo(titleScreen);}}]);
}
function howTo(next){modal('📘 Nasıl Oynanır',`<ul>
<li><b>Sürüş:</b> Sol tarafa dokunup sürükle; araç parmağının yönüne döner, uzaklık = gaz. FREN, EL FRENİ (drift) butonları sağda. Klavye: WASD.</li>
<li><b>Anons:</b> Merkezden gelen görevi KABUL et. Sarı ok ve mini harita hedefi gösterir. Süre dolarsa ceza.</li>
<li><b>Durdurma:</b> SİREN aç ve bir aracın arkasında kal → sağa çeker. Araçtan İN, ETKİLEŞİM ile kontrol et. Gerekçesiz arama/gözaltı şikâyete yol açar.</li>
<li><b>Delil:</b> Olay yerinde delil topla, DOSYA'dan şüphelileri karşılaştır, doğru kişiyi suçla.</li>
<li><b>Kamera:</b> Vücut kamerası her şeyi kaydeder. Şikâyetlerde kayıt seni korur ya da aleyhine delil olur.</li>
<li><b>Yolsuzluk:</b> Rüşvet tekliflerinde risk yüzdesi görünür (tanık, kamera, yakındaki polis). Yakalanırsan kesinti, rütbe düşürme, ihraç, tutuklama.</li>
<li><b>Yaşam:</b> Vardiya arası uyu, ye, ev ve mobilya al. Yorgunluk sürüşü bozar.</li>
<li><b>Kariyer:</b> XP ile terfi; Komiser Yardımcısı'nda ekip kurarsın. Ana hikâyede Kuzgun örgütünün peşine düşersin — birden fazla son var.</li></ul>`,[{t:'Anladım',c:'pri',f:next}]);}
karakolPos();try{init3D();}catch(e){document.getElementById('loading').textContent='3D başlatılamadı: '+e.message;throw e;}
setTimeout(()=>{const l=document.getElementById('loading');if(l)l.remove();},400);titleScreen();requestAnimationFrame(loop);
</script>
