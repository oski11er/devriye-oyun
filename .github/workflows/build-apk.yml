name: APK Derle (Futbol Menajer)

on:
  push:
    branches: [ futbol-menajer ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v4

      - name: APK derle (release, R8 optimizasyonlu)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Test çıktısı
        if: always()
        run: |
          find app/build/test-results -name "*.xml" -exec cat {} \; | grep -v "^\s*$" | head -150 || true

      - name: APK'yı yeniden adlandır
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/FutbolMenajer-v1.0.${{ github.run_number }}.apk
          ls -la out

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: FutbolMenajer-APK
          path: out/*.apk

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: futbol-menajer-v1.0.${{ github.run_number }}
          name: Futbol Menajer v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Futbol Menajer – Android APK
            Telefonunuza indirip kurun (Ayarlar > Bilinmeyen kaynaklardan yüklemeye izin verin).
            Android 8.0+ · tamamen çevrimdışı
          files: out/*.apk
