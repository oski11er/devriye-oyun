name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Bağımlılıkları kur
        run: npm install

      - name: Android projesini oluştur
        run: |
          npx cap add android
          python3 tools/patch_android.py
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı hazırla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Devriye.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Devriye-APK
          path: Devriye.apk

      - name: Sürüm (Release) yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Devriye.apk --title "Devriye $TAG" --notes "Telefondan Devriye.apk dosyasına dokunup indir ve kur. (Bilinmeyen kaynaklardan yüklemeye izin vermen gerekebilir.)" --latest
